name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gcovr
        run: |
          python3 -m venv .venv
          .venv/bin/pip install gcovr

      - name: Configure instrumented C++ build
        run: >
          cmake -S . -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -O0"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build-coverage --parallel

      - name: Run C++ tests
        run: ctest --test-dir build-coverage --output-on-failure

      - name: Generate coverage reports
        run: |
          mkdir -p coverage
          echo "Instrumented coverage files:"
          find build-coverage -name '*.gcda' | head -40
          g++ --version | head -1
          gcov --version | head -1
          .venv/bin/gcovr --verbose --root . --filter '.' --exclude 'build-coverage/' --exclude 'tests/' --exclude 'app/' --exclude-directories 'build-coverage/_deps' --gcov-ignore-errors=no_working_dir_found --print-summary --html-details coverage/index.html --xml coverage/coverage.xml build-coverage

      - name: Validate C++ coverage includes production sources
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("coverage/coverage.xml")
          if not report.is_file():
              raise SystemExit("C++ coverage XML missing")
          root = ET.parse(report).getroot()
          files = [item.attrib.get("filename", "") for item in root.iter("class")]
          production = [p for p in files if p.startswith(("controller/", "engine/", "equipment/", "persistence/", "recipes/", "scheduler/", "wafer/", "web/"))]
          print(f"Coverage source files: {len(production)}; executable lines: {root.attrib.get('lines-valid', 'unknown')}")
          if len(production) < 5 or int(root.attrib.get("lines-valid", 0)) < 100:
              raise SystemExit("Incomplete C++ coverage: production sources missing from gcovr report")
          PY

      - name: Publish C++ coverage summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("coverage/coverage.xml")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## C++ coverage\n\n")
              if report.exists():
                  root = ET.parse(report).getroot()
                  line = float(root.attrib.get("line-rate", 0)) * 100
                  branch = float(root.attrib.get("branch-rate", 0)) * 100
                  summary.write("| Metric | Coverage |\n|---|---:|\n")
                  summary.write(f"| Lines | {line:.1f}% |\n| Branches | {branch:.1f}% |\n")
                  summary.write("\nDownload **cpp-coverage** for the browsable HTML report.\n")
              else:
                  summary.write("Report unavailable; check the C++ coverage job logs.\n")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-coverage
          path: coverage/
          if-no-files-found: warn

  javascript-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run JavaScript tests with coverage
        run: |
          mkdir -p coverage-js
          node --test --experimental-test-coverage --test-coverage-include='web/public/**/*.js' --test-coverage-exclude='tests/**' --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage-js/lcov.info tests/js/*.test.js

      - name: Generate JavaScript HTML report
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov
          genhtml coverage-js/lcov.info --output-directory coverage-js/html --quiet

      - name: Publish JavaScript coverage summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          report = Path("coverage-js/lcov.info")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## JavaScript coverage\n\n")
              if not report.exists():
                  summary.write("Report unavailable; check the JavaScript coverage job logs.\n")
              else:
                  totals = {"LF": 0, "LH": 0, "BRF": 0, "BRH": 0, "FNF": 0, "FNH": 0}
                  for line in report.read_text().splitlines():
                      key, sep, value = line.partition(":")
                      if sep and key in totals:
                          totals[key] += int(value)
                  summary.write("| Metric | Coverage |\n|---|---:|\n")
                  for name, found, hit in (("Lines", "LF", "LH"), ("Branches", "BRF", "BRH"), ("Functions", "FNF", "FNH")):
                      if totals[found]:
                          summary.write(f"| {name} | {100 * totals[hit] / totals[found]:.1f}% |\n")
                  summary.write("\nDownload **javascript-coverage** for the browsable HTML report.\n")
          PY

      - name: Upload JavaScript coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-coverage
          path: coverage-js/
          if-no-files-found: warn
