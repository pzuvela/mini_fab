
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/run.css">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>MiniFab</title>
</head>
<body>

<main class="dashboard">
    <header class="dashboard-header">
        <div>
            <p class="eyebrow">EQUIPMENT CONTROL SYSTEM</p>
            <h1>MiniFab <span>Control Center</span></h1>
        </div>
<span class="version" data-app-version></span>
    </header>

<nav class="main-nav">
    <a href="/run.html" class="active">Run</a>
    <a href="/recipes.html">Recipes</a>
</nav>

    <section class="panel">
        <div class="panel-heading">
            <h2>Equipment Status</h2>
            <span id="state" class="state-badge">Unknown</span>
        </div>

        <div class="status-grid">
            <div class="metric">
                <span class="metric-label">Wafer Location</span>
                <strong id="wafer">Unknown</strong>
            </div>
            <div class="metric">
                <span class="metric-label">Robot</span>
                <strong id="robot">Empty</strong>
            </div>
            <div class="metric">
                <span class="metric-label">Process Module</span>
                <strong id="pm">Empty</strong>
            </div>
        </div>


<div class="recipe-config">
    <h2>Recipe Selection</h2>

    <label>
        Saved Recipe
        <select id="recipeSelect" disabled>
            <option value="">Loading recipes...</option>
        </select>
    </label>

    <div id="recipeDetails" class="recipe-details">
        Select a saved recipe
    </div>

    <a href="/recipes.html">Manage Recipes</a>
</div>

        <div class="control-bar">
            <button id="runButton" disabled>▶ Run Wafer</button>
            <span id="message">Connecting...</span>
        </div>
    </section>

    <section class="panel">
        <div class="panel-heading">
            <h2>Equipment Event Log</h2>
            <span id="eventCount" class="event-count">0 events</span>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Time</th>
                        <th>Event</th>
                        <th>Severity</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="eventRows"></tbody>
            </table>
        </div>
    </section>
</main>

    <script type="module">
        import { createRunViewModel } from
            "/js/viewmodel/runViewModel.js";

        const vm = createRunViewModel();

        const elements = {
            state: document.querySelector("#state"),
            wafer: document.querySelector("#wafer"),
            robot: document.querySelector("#robot"),
            pm: document.querySelector("#pm"),
            message: document.querySelector("#message"),
            runButton: document.querySelector("#runButton"),
	    eventRows: document.querySelector("#eventRows"),
	    eventCount: document.querySelector("#eventCount"),
	    recipeSelect: document.querySelector("#recipeSelect"),
	    recipeDetails: document.querySelector("#recipeDetails")
        };

        // View: only presentation logic.
        vm.subscribe(state => {
            elements.state.textContent = state.equipmentState;
            elements.wafer.textContent = state.waferLocation;
            elements.robot.textContent = state.robot;
            elements.pm.textContent = state.processModule;
            elements.message.textContent = state.message;
            elements.runButton.disabled = !state.canRun;
	    elements.state.className = "state-badge state-" + state.equipmentState.toLowerCase();
	    elements.eventCount.textContent = `${state.events.length} events`;
	    elements.eventRows.replaceChildren();
	    for (const event of state.events) {
		    const row = document.createElement("tr");

		    const values = [
		        event.sequenceId,
		        new Date(event.timestamp).toLocaleTimeString(),
        		event.type,
        		event.severity,
        		event.message
		    ];

		    values.forEach((value, index) => {
        		const cell = document.createElement("td");
        		cell.textContent = value;

        		if (index === 3) {
            			cell.className = "severity severity-" + event.severity.toLowerCase();
        		}

        		row.appendChild(cell);
    			});

    			elements.eventRows.appendChild(row);
		}

const select = elements.recipeSelect;
const selectedValue = state.selectedRecipeId === null
    ? ""
    : String(state.selectedRecipeId);

const currentOptions = Array.from(select.options)
    .slice(1)
    .map(option => `${option.value}:${option.textContent}`);

const newOptions = state.recipes.map(
    recipe => `${recipe.id}:${recipe.name}`
);

if (currentOptions.join("|") !== newOptions.join("|")) {
    select.replaceChildren();

    for (const recipe of state.recipes) {
        const option = document.createElement("option");
        option.value = String(recipe.id);
        option.textContent = `${recipe.id} — ${recipe.name}`;
        select.appendChild(option);
    }
}

if (state.recipes.length === 0) {
    select.replaceChildren();

    const option = document.createElement("option");
    option.value = "";
    option.textContent = state.recipeError
        ? "Failed to load recipes"
        : "No saved recipes";

    select.appendChild(option);
}

select.value = selectedValue;
select.disabled = state.recipes.length === 0;

const selectedRecipe = state.recipes.find(
    recipe => recipe.id === state.selectedRecipeId
);

elements.recipeDetails.textContent = selectedRecipe
    ? `Duration: ${selectedRecipe.durationSeconds} seconds`
    : (state.recipeError ?? "No recipe selected");

        });

elements.runButton.addEventListener("click", () => {
    const recipe = {
        id: Number(document.querySelector("#recipeId").value),
        name: document.querySelector("#recipeName").value,
        durationSeconds: Number(
            document.querySelector("#durationSeconds").value
        )
    };

    vm.run(recipe);
});

        vm.start();

        window.addEventListener("pagehide", () => vm.stop());
    </script>

    
<script src="/js/appConfig.js"></script>

</body>
</html>
