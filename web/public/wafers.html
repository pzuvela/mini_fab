
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/run.css">
    <title>MiniFab - Wafers</title>
</head>
<body>
<main class="dashboard">


<header class="dashboard-header">
    <div>
        <p class="eyebrow">EQUIPMENT CONTROL SYSTEM</p>
        <h1>MiniFab <span>Simulator</span></h1>
    </div>

    <span class="version"
          data-app-version
          id="appVersion"></span>
</header>

    <nav class="main-nav">
        <a href="/run.html">Run</a>
        <a href="/recipes.html">Recipes</a>
        <a href="/jobs.html">Jobs</a>
        <a href="/wafers.html" class="active">Wafers</a>
    </nav>

    <section class="panel">
        <div class="panel-heading">
            <h2>Register Wafer</h2>
        </div>

        <form id="waferForm" class="recipe-config">
            <label>
                Wafer ID
                <input id="waferId"
                       type="text"
                       placeholder="e.g. W2"
                       required>
            </label>

            <label>
                LoadPort Slot
                <input id="waferSlot"
                       type="number"
                       min="1"
                       step="1"
                       placeholder="e.g. 4"
                       required>
            </label>

            <button id="registerButton" type="submit">
                Register Wafer
            </button>
        </form>

        <p id="message" role="status">Loading wafers...</p>
    </section>

    <section class="panel">
        <div class="panel-heading">
            <h2>Registered Wafers</h2>
            <span id="waferCount" class="event-count">
                0 wafers
            </span>
        </div>

	<p id="emptyInventory" hidden>
		No wafers registered yet.
	</p>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Wafer ID</th>
                        <th>Station</th>
                        <th>Slot</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="waferRows"></tbody>
            </table>
        </div>
    </section>


<section class="panel">
    <div class="panel-heading">
        <h2>Manual Wafer Recovery</h2>
    </div>

    <form id="recoveryForm" class="recipe-config">
        <label>
            Wafer ID
            <input
                id="recoveryWaferId"
                type="text"
                readonly
                required
            >
        </label>

        <label>
            Destination LoadPort Slot
            <input
                id="recoverySlot"
                type="number"
                min="1"
                step="1"
                required
                placeholder="e.g. 4"
            >
        </label>

        <button id="recoveryButton" type="submit">
            Recover Wafer
        </button>
    </form>
</section>

<section class="panel">
    <div class="panel-heading">
        <h2>Equipment Event Log</h2>
        <span id="eventCount" class="event-count">
            0 events
        </span>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Time</th>
                    <th>Event</th>
                    <th>Severity</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody id="eventRows"></tbody>
        </table>
    </div>

    <p id="eventError" role="alert"></p>
</section>

</main>

<script type="module" src="/js/pages/wafersPageEntry.js"></script>

<script src="/version.js"></script>

<script src="/js/appConfig.js"></script>

</body>
</html>
